<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Projector Queue</title>
    <link rel="icon" href="/static/vlc16x16.png">
    <style>
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }  /* explicit display rules below must not override hidden */
        body { font-family: system-ui, sans-serif; background: #121212; color: #e0e0e0; margin: 0 auto; padding: 0 16px 16px; max-width: 1100px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #2d2d2d; margin-bottom: 8px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; letter-spacing: .02em; }
        .brand img { width: 28px; height: 28px; filter: drop-shadow(0 0 6px #ff572266); }
        .brand span.sub { color: #777; font-weight: normal; font-size: .85rem; }
        .name-box { width: min(240px, 50vw); padding: 9px 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font-size: .95rem; }
        .name-box:focus { outline: none; border-color: #ff5722; }
        .tracks { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .tracks label { display: flex; align-items: center; gap: 6px; color: #999; font-size: .85rem; }
        .tracks select { background: #222; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; font-size: .9rem; max-width: 60vw; color-scheme: dark; }
        .tracks select option { background: #222; color: #fff; }
        .tracks .pref { color: #888; font-size: .8rem; align-self: center; }
        .tracks .pref a { color: #ff5722; cursor: pointer; margin-left: 6px; }
        h2 { font-size: 1rem; color: #999; text-transform: uppercase; letter-spacing: .05em; margin: 20px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
        h2 small { text-transform: none; letter-spacing: 0; font-weight: normal; color: #666; }
        .panel { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 10px; padding: 14px; }
        button { background: #333; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; font-size: .95rem; }
        button:hover { background: #444; }
        button:disabled { opacity: .5; cursor: default; }
        button.primary { background: #ff5722; }
        button.primary:hover { background: #e64a19; }
        button.danger { background: #5a1f1f; }
        .muted { color: #888; text-align: center; padding: 12px; }

        /* posters */
        .poster { position: relative; background: linear-gradient(160deg, #2a2a2a, #1a1a1a); border-radius: 6px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: .7rem; text-align: center; padding: 4px; }
        .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .poster.thumb { width: 44px; height: 66px; }

        /* now playing */
        .now { display: flex; gap: 14px; align-items: flex-start; }
        .now .poster { width: 80px; height: 120px; }
        .now .info { flex: 1; min-width: 0; }
        #now-title { font-weight: bold; font-size: 1.15rem; word-break: break-word; }
        #now-file { color: #888; font-size: .8rem; word-break: break-all; }
        #now-state { color: #999; font-size: .9rem; margin-top: 4px; }
        .progress { height: 6px; background: #333; border-radius: 3px; margin: 10px 0; overflow: hidden; }
        .progress > div { height: 100%; background: #ff5722; width: 0; transition: width .5s linear; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

        /* queue */
        /* Long queues (a whole season) scroll inside the panel instead of pushing the library down. */
        #queue { padding: 4px 0; max-height: min(420px, 50vh); overflow-y: auto; overscroll-behavior: contain; }
        .queue-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #2d2d2d; background: #1e1e1e; }
        .queue-item:last-child { border-bottom: none; }
        .queue-item.current { color: #ff5722; position: sticky; top: 0; z-index: 1; box-shadow: 0 2px 6px #0008; }
        .queue-item .handle { cursor: grab; color: #666; font-size: 1.4rem; padding: 4px 6px; touch-action: none; user-select: none; }
        .queue-item .text { flex: 1; min-width: 0; }
        .queue-item .title { font-weight: bold; }
        .queue-item .file { color: #888; font-size: .78rem; word-break: break-all; }
        .queue-item.pending { opacity: .75; }
        .queue-item.pending .handle { cursor: default; color: #ff5722; }
        .queue-item.pending.error .handle { color: #e53935; }
        .queue-item.sortable-ghost { opacity: .3; }
        .queue-item.sortable-chosen { background: #2a2a2a; }
        .queue-item.sortable-fallback { opacity: .9; box-shadow: 0 4px 16px #000a; border-radius: 8px; }
        /* A season or playlist queued in one go: one block that drags as a unit, items reorder inside it. */
        .queue-group { border-bottom: 1px solid #2d2d2d; background: #181818; }
        .queue-group:last-child { border-bottom: none; }
        .queue-group .group-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #262626; }
        .queue-group .group-head .text { flex: 1; min-width: 0; }
        .queue-group .group-head .title { font-weight: bold; }
        .queue-group .group-head .file { color: #888; font-size: .78rem; }
        .queue-group .group-head .chevron { cursor: pointer; color: #888; padding: 4px 6px; user-select: none; }
        .queue-group .group-items .queue-item { padding-left: 26px; }
        .queue-group.collapsed .group-items { display: none; }
        .queue-group.sortable-ghost { opacity: .3; }
        .queue-group.sortable-chosen { background: #2a2a2a; }
        .queue-group.sortable-fallback { opacity: .9; box-shadow: 0 4px 16px #000a; border-radius: 8px; }
        .secret { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0; }
        .secret img { max-width: min(340px, 90vw); border-radius: 12px; box-shadow: 0 8px 30px #000a; }
        .secret button { font-size: 1.1rem; padding: 12px 28px; }
        body.sortable-dragging { user-select: none; cursor: grabbing; }

        /* image drop zone */
        .dropzone { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border: 2px dashed #3a3a3a; transition: border-color .15s, background .15s; }
        .dropzone.over { border-color: #ff5722; background: #2a1d18; }
        .dropzone.busy { opacity: .6; pointer-events: none; }
        .drop-text { color: #bbb; }
        .drop-text a { color: #ff5722; cursor: pointer; text-decoration: underline; }
        .drop-duration { display: flex; align-items: center; gap: 6px; color: #999; font-size: .9rem; }
        .drop-duration select { background: #222; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; font-size: .9rem; color-scheme: dark; }

        /* library */
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .search-box { flex: 1 1 240px; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 1rem; }
        #chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { background: #222; border: 1px solid #333; font-weight: normal; padding: 10px 14px; line-height: 1.2; }
        .chip.active { background: #ff5722; border-color: #ff5722; }
        #sync { border-color: #444; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .card { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
        .card:hover { border-color: #ff5722; }
        .card .poster { width: 100%; aspect-ratio: 2 / 3; border-radius: 0; font-size: .9rem; color: #777; }
        .card.wide .poster { aspect-ratio: 16 / 9; }
        .grid.wide { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        .chip.yt.active { background: #e53935; border-color: #e53935; }
        .card .meta { padding: 8px; }
        .card .title { font-weight: bold; font-size: .9rem; line-height: 1.2; }
        .card .sub { color: #888; font-size: .75rem; margin-top: 3px; }

        /* detail sheet */
        #sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 10; }
        #sheet { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(700px, calc(100vw - 32px)); max-height: 85vh; background: #1e1e1e; border: 1px solid #333; border-radius: 14px; padding: 16px; display: none; z-index: 11; overflow-y: auto; }
        #sheet.open, #sheet-backdrop.open { display: block; }
        .sheet-head { display: flex; gap: 14px; margin-bottom: 12px; }
        .sheet-head .poster { width: 90px; height: 135px; }
        .sheet-head h3 { margin: 0 0 4px; }
        .sheet-file { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0 8px 12px; border-top: 1px solid #2d2d2d; }
        .sheet-file .name { word-break: break-all; font-size: .9rem; }
        .sheet-season { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0 6px; margin-top: 8px; border-top: 2px solid #333; }
        .sheet-season.collapsible { cursor: pointer; user-select: none; }
        .sheet-season.collapsible:hover .season-name { color: #ff8a65; }
        .sheet-season .season-name { font-weight: bold; color: #ff5722; }
        .sheet-season .chevron { display: inline-block; width: 1.1em; color: #888; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff5722; color: #fff; padding: 12px 20px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; z-index: 20; }
        #toast.show { opacity: 1; }
        #toast.error { background: #c62828; }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><img src="/static/vlc-48.png" alt="VLC" width="28" height="28"><span class="sub">LAN queue</span></div>
        <input type="text" id="username" class="name-box" placeholder="Your name (optional)" maxlength="40" autocomplete="off">
    </header>

    <h2>Now playing</h2>
    <div class="panel now">
        <div class="poster" id="now-poster"></div>
        <div class="info">
            <div id="now-title">Connecting to VLC...</div>
            <div id="now-file"></div>
            <div id="now-state"></div>
            <div class="progress"><div id="progress-bar"></div></div>
            <div class="controls">
                <button data-action="previous">⏮</button>
                <button data-action="pause" class="primary">⏯ Play / Pause</button>
                <button data-action="next">⏭</button>
                <button data-action="stop">⏹</button>
                <button data-action="fullscreen">⛶</button>
            </div>
            <div class="tracks" id="tracks" hidden>
                <label>Audio <select id="track-audio"></select></label>
                <label>Subtitles <select id="track-subtitle"></select></label>
                <span class="pref" id="track-pref" hidden></span>
            </div>
        </div>
    </div>

    <h2>Up next <small id="queue-meta">drag ⠿ to reorder</small></h2>
    <div class="panel" id="queue"><div class="muted">Queue is empty</div></div>

    <h2>Show a picture <small>memes, scoreboards, info</small></h2>
    <div class="panel dropzone" id="dropzone">
        <input type="file" id="image-file" accept="image/*" hidden>
        <div class="drop-text"><strong>Drop an image here</strong> or <a id="image-pick">tap to choose one</a></div>
        <label class="drop-duration">Show for
            <select id="image-duration">
                <option value="10">10 seconds</option>
                <option value="15" selected>15 seconds</option>
                <option value="30">30 seconds</option>
                <option value="60">1 minute</option>
                <option value="300">5 minutes</option>
                <option value="-1">until skipped</option>
            </select>
        </label>
    </div>

    <h2>Library <small id="lib-count"></small></h2>
    <div class="toolbar">
        <input type="text" id="search" class="search-box" placeholder="Search movies, TV shows, anime..." autocomplete="off">
        <div id="chips"></div>
        <button id="sync" class="chip" title="Rescan this library on the NAS">Sync</button>
    </div>
    <div class="grid" id="grid"><div class="muted">Loading NAS library...</div></div>
    <div class="muted" id="grid-note"></div>
    <div id="sheet-backdrop"></div>
    <div id="sheet"></div>
    <div id="toast"></div>

    <script src="/static/Sortable.min.js"></script>
    <script>
        let groups = [];
        let activeLibrary = '';       // '' = all, a library name, or YT for YouTube search
        const YT = '__youtube__';
        let ytResults = [];
        let ytPlaylist = null;  // set when the search box holds a playlist link
        let ytTimer = null;
        let ytEnabled = false;
        let dragging = false;
        let toastTimer;
        let lastCurrentId = null;
        const MAX_CARDS = 200;

        // Optional name, remembered on this device and sent with every queue request.
        const nameBox = document.getElementById('username');
        try { nameBox.value = localStorage.getItem('lanq_name') || ''; } catch (e) {}
        nameBox.addEventListener('input', () => { try { localStorage.setItem('lanq_name', nameBox.value.trim()); } catch (e) {} });

        function fmtDuration(s) {
            s = Math.max(0, Math.round(s || 0));
            const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
            return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
        }

        function toast(msg, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'show' + (isError ? ' error' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.className = '', isError ? 7000 : 3000);  // errors stay long enough to read
        }

        async function api(path, options = {}) {
            // JSON bodies get the header; FormData must be left alone so the browser sets the multipart boundary.
            if (typeof options.body === 'string' && !options.headers) options.headers = {'Content-Type': 'application/json'};
            const res = await fetch(path, options);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
            return data;
        }

        function fmtTime(s) {
            s = Math.max(0, Math.floor(s || 0));
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
            return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
        }

        // Poster element: the title as a placeholder, with the image laid over it once it loads.
        // The img must be in the DOM from the start or lazy loading never triggers.
        function posterEl(url, title, extraClass = '') {
            const div = document.createElement('div');
            div.className = 'poster ' + extraClass;
            div.textContent = title || '';
            if (url) {
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.alt = '';
                img.onerror = () => img.remove();
                img.src = url;
                div.appendChild(img);
            }
            return div;
        }

        // --- Library ---
        async function fetchMedia(refresh = '') {
            try {
                const data = await api('/api/media' + (refresh ? '?refresh=' + encodeURIComponent(refresh) : ''));
                groups = data.groups;
                ytEnabled = !!data.youtube_enabled;
                renderChips(data.libraries);
                renderGrid();
                const note = document.getElementById('lib-count');
                note.textContent = data.scanning ? `scanning ${data.scanning_libraries.join(', ')}...` : `${groups.length} titles`;
                document.getElementById('sync').disabled = data.scanning;
                if (!data.posters_enabled && !data.scanning) note.textContent += ' · posters off (no TMDB key)';
                if (data.posters_warming) note.textContent += ' · fetching posters...';
                // Keep polling while the NAS scan or the poster warm-up is running so new art appears on its own.
                if (data.scanning) setTimeout(() => fetchMedia(), 3000);
                else if (data.posters_warming) setTimeout(() => fetchMedia(), 15000);
            } catch (e) {
                toast('Could not load library: ' + e.message, true);
            }
        }

        function renderChips(libraries) {
            const box = document.getElementById('chips');
            if (box.childElementCount) return;
            for (const lib of ['', ...libraries, ...(ytEnabled ? [YT] : [])]) {
                const b = document.createElement('button');
                b.className = 'chip' + (lib === YT ? ' yt' : '') + (lib === activeLibrary ? ' active' : '');
                b.textContent = lib === YT ? 'YouTube' : (lib || 'All');
                b.onclick = () => {
                    activeLibrary = lib;
                    box.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === b));
                    updateSyncLabel();
                    if (lib === YT) { document.getElementById('search').focus(); searchYouTube(); } else renderGrid();
                };
                box.appendChild(b);
            }
            updateSyncLabel();
        }

        // Sync rescans just the selected library (or everything when "All" is selected). Hidden for YouTube.
        function updateSyncLabel() {
            const isYt = activeLibrary === YT;
            document.getElementById('sync').hidden = isYt;
            document.getElementById('sync').textContent = activeLibrary ? `Sync ${activeLibrary}` : 'Sync all';
            document.getElementById('search').placeholder = isYt ? 'Search YouTube or paste a link...' : 'Search movies, TV shows, anime...';
        }

        // --- YouTube ---
        async function searchYouTube() {
            if (isSecret()) { renderSecret(); return; }
            const q = document.getElementById('search').value.trim();
            const grid = document.getElementById('grid');
            document.getElementById('grid-note').textContent = '';
            if (q.length < 3) { ytResults = []; grid.className = 'grid wide'; grid.innerHTML = '<div class="muted">Type to search YouTube, or paste a video link.</div>'; return; }
            grid.className = 'grid wide';
            grid.innerHTML = '<div class="muted">Searching YouTube...</div>';
            try {
                const data = await api('/api/youtube/search?q=' + encodeURIComponent(q));
                if (activeLibrary !== YT || document.getElementById('search').value.trim() !== q) return;  // stale
                ytResults = data.results;
                ytPlaylist = data.playlist || null;
                renderYouTube();
            } catch (e) {
                grid.innerHTML = `<div class="muted">${e.message}</div>`;
            }
        }

        function renderYouTube() {
            const grid = document.getElementById('grid');
            grid.className = 'grid wide';
            grid.innerHTML = '';
            if (ytPlaylist) {
                // The pasted link is a playlist: offer the whole thing (downloaded one at a time, queued as a block).
                const card = document.createElement('div');
                card.className = 'card wide';
                const meta = document.createElement('div');
                meta.className = 'meta';
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = ytPlaylist.mix ? ytPlaylist.title : `Playlist: ${ytPlaylist.title}`;
                const sub = document.createElement('div');
                sub.className = 'sub';
                sub.textContent = (ytPlaylist.mix
                        ? `A YouTube Mix (endless) · the first ${ytPlaylist.count} get queued`
                        : `${ytPlaylist.count} video${ytPlaylist.count === 1 ? '' : 's'}` + (ytPlaylist.count > ytPlaylist.limit ? ` · the first ${ytPlaylist.limit} get queued` : ''))
                    + ' · fetched one at a time, kept together in the queue';
                const btn = document.createElement('button');
                btn.className = 'primary';
                btn.textContent = ytPlaylist.mix ? '＋ Queue the Mix' : '＋ Queue playlist';
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    btn.disabled = true;
                    try {
                        const data = await api('/api/queue/youtube', {method: 'POST', body: JSON.stringify({url: ytPlaylist.url, user: nameBox.value.trim(), title: ytPlaylist.title})});
                        toast(data.message);
                        document.getElementById('search').value = '';
                        ytResults = []; ytPlaylist = null;
                        renderGrid();
                        refreshStatus();
                    } catch (err) {
                        toast(err.message, true);
                        btn.disabled = false;
                    }
                };
                meta.append(title, sub, btn);
                card.appendChild(meta);
                grid.appendChild(card);
            }
            if (!ytResults.length && !ytPlaylist) { grid.innerHTML = '<div class="muted">No results.</div>'; return; }
            for (const v of ytResults) {
                const card = document.createElement('div');
                card.className = 'card wide';
                card.appendChild(posterEl(v.thumbnail, v.title));
                const meta = document.createElement('div');
                meta.className = 'meta';
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = v.title;
                const sub = document.createElement('div');
                sub.className = 'sub';
                sub.textContent = [v.uploader, v.live ? 'LIVE' : (v.duration ? fmtTime(v.duration) : '')].filter(Boolean).join(' · ');
                meta.append(title, sub);
                card.appendChild(meta);
                card.onclick = () => openYouTubeSheet(v);
                grid.appendChild(card);
            }
        }

        function openYouTubeSheet(v) {
            const sheet = document.getElementById('sheet');
            sheet.innerHTML = '';
            const head = document.createElement('div');
            head.className = 'sheet-head';
            const thumb = posterEl(v.thumbnail, v.title);
            thumb.style.width = '160px'; thumb.style.height = '90px';
            head.appendChild(thumb);
            const info = document.createElement('div');
            const h3 = document.createElement('h3');
            h3.textContent = v.title;
            const sub = document.createElement('div');
            sub.style.color = '#888';
            sub.textContent = [v.uploader, v.live ? 'LIVE' : (v.duration ? fmtTime(v.duration) : ''), 'YouTube'].filter(Boolean).join(' · ');
            info.append(h3, sub);
            head.appendChild(info);
            sheet.appendChild(head);
            const row = document.createElement('div');
            row.className = 'sheet-file';
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = v.url;
            const btn = document.createElement('button');
            btn.className = 'primary';
            btn.textContent = '＋ Queue';
            btn.onclick = async () => {
                btn.disabled = true;
                try {
                    const data = await api('/api/queue/youtube', {method: 'POST', body: JSON.stringify({url: v.url, user: nameBox.value.trim(), title: v.title})});
                    toast(data.message + ' — it joins the queue when the download finishes');
                    closeSheet();
                    // Start fresh for the next person: clear the search and the results.
                    document.getElementById('search').value = '';
                    ytResults = [];
                    renderGrid();
                    refreshStatus();
                } catch (e) {
                    toast(e.message, true);
                } finally {
                    btn.disabled = false;
                }
            };
            row.append(name, btn);
            sheet.appendChild(row);
            sheet.classList.add('open');
            document.getElementById('sheet-backdrop').classList.add('open');
        }
        document.getElementById('sync').onclick = () => {
            toast(activeLibrary ? `Rescanning ${activeLibrary}...` : 'Rescanning all libraries...');
            fetchMedia(activeLibrary || 'all');
        };

        // The secret menu. Nothing on the page mentions it; typing @claude in the search box
        // swaps the grid for a handful of dice.
        const SECRET = '@claude';
        function isSecret() { return document.getElementById('search').value.trim().toLowerCase() === SECRET; }

        function renderSecret() {
            const grid = document.getElementById('grid');
            document.getElementById('grid-note').textContent = '';
            grid.className = 'grid wide';
            grid.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'secret';
            const gif = document.createElement('img');
            gif.src = '/static/dashing-driver-car.gif?v=' + Date.now();  // the file gets swapped; never show a cached one
            gif.alt = 'CLAUDE TAKE THE WHEEL';
            const btn = document.createElement('button');
            btn.className = 'primary';
            btn.textContent = '🎲 Random';
            btn.onclick = async () => {
                btn.disabled = true;
                try {
                    // "any": a movie, an episode, an anime, or one of tonight's YouTube downloads
                    const data = await api('/api/queue/random', {method: 'POST', body: JSON.stringify({kind: 'any', user: nameBox.value.trim()})});
                    toast(data.message);
                    refreshStatus();
                } catch (e) {
                    toast(e.message, true);
                } finally {
                    btn.disabled = false;
                }
            };
            card.append(gif, btn);
            grid.appendChild(card);
        }

        function renderGrid() {
            if (isSecret()) { renderSecret(); return; }
            if (activeLibrary === YT) { renderYouTube(); return; }
            document.getElementById('grid').className = 'grid';
            const terms = document.getElementById('search').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
            const matches = groups.filter(g =>
                (!activeLibrary || g.library === activeLibrary) &&
                terms.every(t => g.group.toLowerCase().includes(t) || g.title.toLowerCase().includes(t) ||
                                 (terms.length && g.items.some(i => i.name.toLowerCase().includes(t))))
            );
            const grid = document.getElementById('grid');
            const note = document.getElementById('grid-note');
            grid.innerHTML = '';
            note.textContent = '';
            if (matches.length === 0) {
                grid.innerHTML = `<div class="muted">${groups.length ? 'No matching titles.' : 'No videos found yet.'}</div>`;
                return;
            }
            const frag = document.createDocumentFragment();
            for (const g of matches.slice(0, MAX_CARDS)) {
                const card = document.createElement('div');
                card.className = 'card';
                card.appendChild(posterEl(g.poster, g.title));
                const meta = document.createElement('div');
                meta.className = 'meta';
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = g.title;
                const sub = document.createElement('div');
                sub.className = 'sub';
                sub.textContent = [g.year, g.items.length > 1 ? `${g.items.length} files` : g.library].filter(Boolean).join(' · ');
                meta.append(title, sub);
                card.appendChild(meta);
                card.onclick = () => openSheet(g);
                frag.appendChild(card);
            }
            grid.appendChild(frag);
            if (matches.length > MAX_CARDS) note.textContent = `Showing ${MAX_CARDS} of ${matches.length}. Keep typing to narrow it down.`;
        }

        // --- Detail sheet (pick which file to queue) ---
        function openSheet(g) {
            const sheet = document.getElementById('sheet');
            sheet.innerHTML = '';
            const head = document.createElement('div');
            head.className = 'sheet-head';
            head.appendChild(posterEl(g.poster, g.title));
            const info = document.createElement('div');
            const h3 = document.createElement('h3');
            h3.textContent = g.title + (g.year ? ` (${g.year})` : '');
            const sub = document.createElement('div');
            sub.className = 'sub';
            sub.style.color = '#888';
            sub.textContent = `${g.library} · ${g.items.length} file${g.items.length === 1 ? '' : 's'}`;
            info.append(h3, sub);
            head.appendChild(info);
            sheet.appendChild(head);

            // Group episodes by season (items arrive sorted by season, then episode).
            const seasons = [];
            for (const item of g.items) {
                const label = item.season || '';
                let s = seasons[seasons.length - 1];
                if (!s || s.label !== label) { s = {label, items: []}; seasons.push(s); }
                s.items.push(item);
            }
            // Season header with a Queue-season button; clicking the header collapses/expands its episodes.
            const addSeasonRow = (label, items, collapsible, collapsed) => {
                const episodes = items.filter(i => !i.extra);
                const extras = items.length - episodes.length;
                const row = document.createElement('div');
                row.className = 'sheet-season' + (collapsible ? ' collapsible' : '');
                const name = document.createElement('div');
                name.className = 'season-name';
                const chevron = document.createElement('span');
                chevron.className = 'chevron';
                chevron.textContent = collapsed ? '▸' : '▾';
                if (collapsible) name.appendChild(chevron);
                name.append(`${label} · ${episodes.length} episode${episodes.length === 1 ? '' : 's'}` + (extras ? ` + ${extras} extras` : ''));
                const btn = document.createElement('button');
                btn.textContent = label === 'All' ? '＋ Queue all' : '＋ Queue season';
                btn.disabled = episodes.length === 0;
                const blockLabel = label === 'All' || label.toLowerCase().includes(g.title.toLowerCase()) ? (label === 'All' ? g.title : label) : `${g.title} · ${label}`;
                btn.onclick = (e) => { e.stopPropagation(); queueFiles(episodes, btn, blockLabel); };
                row.append(name, btn);
                sheet.appendChild(row);
                const body = document.createElement('div');
                body.className = 'season-eps';
                body.hidden = collapsed;
                sheet.appendChild(body);
                if (collapsible) row.onclick = () => { body.hidden = !body.hidden; chevron.textContent = body.hidden ? '▸' : '▾'; };
                return body;
            };
            const addEpisodeRow = (parent, item, numbered) => {
                const row = document.createElement('div');
                row.className = 'sheet-file';
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = (item.episode != null && numbered && !item.extra ? `${item.episode}. ` : '') + item.file;
                if (item.extra) name.style.color = '#888';
                const btn = document.createElement('button');
                btn.className = 'primary';
                btn.textContent = '＋ Queue';
                btn.onclick = () => queueFile(item, btn);
                row.append(name, btn);
                parent.appendChild(row);
            };
            const hasSeasons = seasons.length > 1 || (seasons[0] && seasons[0].label);
            if (!hasSeasons) {
                // One flat list: collapsible only when it's long, and open by default.
                const parent = g.items.length > 1 ? addSeasonRow('All', g.items, g.items.length > 12, false) : sheet;
                for (const item of g.items) addEpisodeRow(parent, item, false);
            } else {
                // Several seasons start collapsed so a long show opens as a short list of seasons.
                const collapsed = seasons.length > 1;
                for (const s of seasons) {
                    const body = addSeasonRow(s.label || 'Other', s.items, true, collapsed);
                    for (const item of s.items) addEpisodeRow(body, item, true);
                }
            }
            sheet.classList.add('open');
            document.getElementById('sheet-backdrop').classList.add('open');
        }

        function closeSheet() {
            document.getElementById('sheet').classList.remove('open');
            document.getElementById('sheet-backdrop').classList.remove('open');
        }
        document.getElementById('sheet-backdrop').onclick = closeSheet;

        async function queueFile(item, btn) {
            return queueFiles([item], btn);
        }

        async function queueFiles(items, btn, label = '') {
            btn.disabled = true;
            try {
                const user = nameBox.value.trim();
                const data = items.length === 1
                    ? await api('/api/queue', {method: 'POST', body: JSON.stringify({id: items[0].id, user})})
                    : await api('/api/queue/batch', {method: 'POST', body: JSON.stringify({ids: items.map(i => i.id), user, label})});
                toast(data.message);
                closeSheet();
                refreshStatus();
            } catch (e) {
                toast(e.message, true);
            } finally {
                btn.disabled = false;
            }
        }

        // --- Now playing / queue ---
        async function refreshStatus() {
            if (dragging) return;
            try {
                const s = await api('/api/status');
                document.getElementById('now-title').textContent = s.title || s.now_playing || 'Nothing playing';
                document.getElementById('now-file').textContent = s.title ? s.now_playing : '';
                document.getElementById('now-state').textContent =
                    s.state + (s.length ? ` · ${fmtTime(s.time)} / ${fmtTime(s.length)}` : '');
                document.getElementById('progress-bar').style.width = s.length ? (100 * s.time / s.length) + '%' : '0';
                const np = document.getElementById('now-poster');
                if (np.dataset.src !== (s.poster || '')) {
                    np.dataset.src = s.poster || '';
                    np.replaceWith(Object.assign(posterEl(s.poster, ''), {id: 'now-poster'}));
                    document.getElementById('now-poster').dataset.src = s.poster || '';
                }
                renderQueue(s.queue, s.state, s.pending || []);
                renderQueueMeta(s);
                const cur = s.queue.find(q => q.current);
                const curId = s.state === 'stopped' ? null : (cur ? cur.id : null);
                if (curId !== lastCurrentId) { lastCurrentId = curId; loadTracks(); }
                else if (curId !== null && ++tracksRetry % 3 === 0) loadTracks();  // every ~9s: pick up the watcher's switches
            } catch (e) {
                document.getElementById('now-title').textContent = 'VLC unavailable';
                document.getElementById('now-state').textContent = e.message;
            }
        }

        // Total time left: rest of the current item plus every upcoming one.
        function renderQueueMeta(s) {
            const cur = s.queue.findIndex(q => q.current);
            const upcoming = (s.state === 'stopped' || cur < 0) ? s.queue : s.queue.slice(cur + 1);
            let total = upcoming.reduce((t, q) => t + Math.max(0, q.duration || 0), 0);
            if (s.state !== 'stopped' && s.length) total += Math.max(0, s.length - s.time);
            const parts = [];
            if (upcoming.length) parts.push(`${upcoming.length} queued`);
            if (total) parts.push(`${fmtDuration(total)} left`);
            parts.push('drag ⠿ to reorder');
            document.getElementById('queue-meta').textContent = parts.join(' · ');
        }

        // --- Audio / subtitle tracks ---
        let tracksRetry = 0;
        async function loadTracks(retry = 0) {
            const row = document.getElementById('tracks');
            if (lastCurrentId === null) { row.hidden = true; return; }
            try {
                const t = await api('/api/tracks');
                const ready = ['audio', 'subtitle'].some(k => (t[k] || []).length > 1);
                // Right after an episode starts VLC hasn't listed its tracks yet: keep what we have and retry.
                if (!ready && retry < 10) { setTimeout(() => loadTracks(retry + 1), 1500); return; }
                fillTracks(t);
            } catch (e) {
                row.hidden = true;  // VLC not launched with the custom HTTP folder, or nothing playing
            }
        }

        function fillTracks(t) {
            const row = document.getElementById('tracks');
            let any = false;
            for (const kind of ['audio', 'subtitle']) {
                const sel = document.getElementById('track-' + kind);
                const list = t[kind] || [];
                const sig = JSON.stringify(list.map(tr => [tr.id, tr.name]));
                if (sel.dataset.sig !== sig) {  // only rebuild when the track list itself changed
                    sel.dataset.sig = sig;
                    sel.innerHTML = '';
                    for (const tr of list) {
                        const opt = document.createElement('option');
                        opt.value = tr.id;
                        opt.textContent = tr.name.replace(/ - \[[^\]]*\]$/, '');  // "English 2.0 FLAC - [English]" -> "English 2.0 FLAC"
                        sel.appendChild(opt);
                    }
                }
                const current = list.find(tr => tr.current);
                if (current && document.activeElement !== sel) sel.value = String(current.id);
                sel.parentElement.hidden = list.length <= 1;
                any = any || list.length > 1;
            }
            row.hidden = !any;
            // What's remembered for this show (applied automatically to its other episodes).
            const pref = document.getElementById('track-pref');
            const p = t.pref || {};
            const parts = [p.audio && `audio: ${p.audio.replace(/ - \[[^\]]*\]$/, '')}`, p.subtitle && `subs: ${p.subtitle.replace(/ - \[[^\]]*\]$/, '')}`].filter(Boolean);
            pref.hidden = parts.length === 0;
            pref.innerHTML = '';
            if (parts.length) {
                pref.append(`Remembered for ${p.title}: ${parts.join(', ')}`);
                const a = document.createElement('a');
                a.textContent = 'forget';
                a.onclick = async () => { try { fillTracks(await api('/api/tracks/pref', {method: 'DELETE'})); } catch (e) { toast(e.message, true); } };
                pref.appendChild(a);
            }
        }

        for (const kind of ['audio', 'subtitle']) {
            document.getElementById('track-' + kind).addEventListener('change', async (e) => {
                try {
                    const t = await api('/api/tracks', {method: 'POST', body: JSON.stringify({kind, id: Number(e.target.value)})});
                    fillTracks(t);
                    if (t.pref && t.pref.title) toast(`${kind === 'audio' ? 'Audio' : 'Subtitles'} remembered for ${t.pref.title}`);
                } catch (err) { toast(err.message, true); }
            });
        }

        function renderQueue(queue, state, pending = []) {
            if (dragging) return;
            const container = document.getElementById('queue');
            // Hide already-played items: show the current one and everything after it.
            const cur = queue.findIndex(q => q.current);
            const visible = (state === 'stopped' || cur < 0) ? queue : queue.slice(cur);
            const key = JSON.stringify([visible.map(q => [q.id, q.current && state !== 'stopped', q.queued_by, q.group]),
                                        pending.map(p => [p.id, Math.round(p.percent), p.status])]);
            if (container.dataset.key === key) return;  // nothing changed, don't disturb the DOM
            container.dataset.key = key;
            container.innerHTML = '';
            if (!visible.length && !pending.length) { container.innerHTML = '<div class="muted">Queue is empty</div>'; return; }
            renderQueueItems(container, visible, state);
            // YouTube downloads in progress sit at the bottom until they join the real queue.
            for (const p of pending) {
                const div = document.createElement('div');
                div.className = 'queue-item pending' + (p.status === 'error' ? ' error' : '');
                const icon = document.createElement('span');
                icon.className = 'handle';
                icon.textContent = p.status === 'error' ? '!' : '⇣';
                const text = document.createElement('div');
                text.className = 'text';
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = p.title;
                const sub = document.createElement('div');
                sub.className = 'file';
                sub.textContent = p.status === 'error' ? `Failed: ${p.error}`
                    : p.status === 'cancelled' ? 'Download cancelled'
                    : p.status === 'queued' ? 'Downloaded, added to queue'
                    : `Fetching from YouTube · ${Math.round(p.percent)}%` + (p.eta ? ` · ${p.eta} left` : '') + (p.user ? ` · queued by ${p.user}` : '');
                text.append(title, sub);
                div.append(icon, posterEl(p.thumbnail, '', 'thumb'), text);
                if (p.status === 'error' || p.status === 'fetching') {
                    const btn = document.createElement('button');
                    btn.className = 'danger';
                    btn.textContent = '✕';
                    btn.title = p.status === 'fetching' ? 'Cancel download' : 'Dismiss';
                    btn.onclick = async () => {
                        try {
                            const data = await api('/api/youtube/jobs/' + p.id, {method: 'DELETE'});
                            if (p.status === 'fetching') toast(data.message);
                            container.dataset.key = ''; refreshStatus();
                        } catch (e) { toast(e.message, true); }
                    };
                    div.appendChild(btn);
                }
                container.appendChild(div);
            }
        }

        // Consecutive items of one group (a season, a playlist) render as a block: a header that
        // drags the whole thing, the items reorderable inside. The server only ever sees the flat order.
        const collapsedGroups = new Set();

        function renderQueueItems(container, visible, state) {
            let block = null;
            for (const item of visible) {
                const isCurrent = item.current && state !== 'stopped';
                const el = queueItemEl(item, isCurrent, container, Boolean(item.group) && !isCurrent);
                if (!item.group || isCurrent) { block = null; container.appendChild(el); continue; }
                if (!block || block.dataset.group !== item.group) {
                    block = groupEl(item, container);
                    container.appendChild(block);
                }
                block.querySelector('.group-items').appendChild(el);
                block._items.push(item);
                updateGroupHead(block);
            }
        }

        function groupEl(item, container) {
            const block = document.createElement('div');
            block.className = 'queue-group' + (collapsedGroups.has(item.group) ? ' collapsed' : '');
            block.dataset.group = item.group;
            block._items = [];
            const head = document.createElement('div');
            head.className = 'group-head';
            const handle = document.createElement('span');
            handle.className = 'handle';
            handle.textContent = '⠿';
            handle.title = 'Drag the whole block';
            const chevron = document.createElement('span');
            chevron.className = 'chevron';
            chevron.textContent = collapsedGroups.has(item.group) ? '▸' : '▾';
            chevron.onclick = () => {
                const now = block.classList.toggle('collapsed');
                if (now) collapsedGroups.add(item.group); else collapsedGroups.delete(item.group);
                chevron.textContent = now ? '▸' : '▾';
            };
            const text = document.createElement('div');
            text.className = 'text';
            const title = document.createElement('div');
            title.className = 'title';
            title.textContent = item.group_label || 'Queued together';
            const file = document.createElement('div');
            file.className = 'file';
            text.append(title, file);
            const btn = document.createElement('button');
            btn.className = 'danger';
            btn.textContent = '✕';
            btn.title = 'Remove the whole block from the queue';
            btn.onclick = async () => {
                try { const d = await api('/api/queue/group/' + item.group, {method: 'DELETE'}); toast(d.message); container.dataset.key = ''; refreshStatus(); }
                catch (e) { toast(e.message, true); }
            };
            head.append(handle, chevron, text, btn);
            const items = document.createElement('div');
            items.className = 'group-items';
            block.append(head, items);
            // Items move only within their block (their own Sortable group name keeps them out of the main list).
            Sortable.create(items, {
                group: 'block-' + item.group,
                handle: '.in-handle',
                animation: 150, delay: 150, delayOnTouchOnly: true,
                forceFallback: true, fallbackTolerance: 3, forceAutoScrollFallback: true,
                scroll: true, scrollSensitivity: 80, scrollSpeed: 12, bubbleScroll: true,
                onStart: () => { dragging = true; document.body.classList.add('sortable-dragging'); },
                onEnd: () => { dragging = false; document.body.classList.remove('sortable-dragging'); sendOrder(); },
            });
            return block;
        }

        function updateGroupHead(block) {
            const items = block._items;
            const total = items.reduce((t, q) => t + Math.max(0, q.duration || 0), 0);
            const who = (items.find(q => q.queued_by) || {}).queued_by;
            block.querySelector('.group-head .file').textContent =
                [`${items.length} item${items.length === 1 ? '' : 's'}`, total ? fmtDuration(total) : '', who ? `queued by ${who}` : ''].filter(Boolean).join(' · ');
        }

        // The flat order the server wants: blocks contribute their items in place. Both the VLC ids
        // and the files go, because VLC renumbers the queue on every rebuild and the ids may be stale.
        function queueOrder() {
            const ids = [], uris = [];
            const take = d => { ids.push(Number(d.dataset.id)); uris.push(d.dataset.uri); };
            for (const el of document.getElementById('queue').children) {
                if (el.classList.contains('queue-group')) el.querySelectorAll('.queue-item').forEach(take);
                else if (el.classList.contains('queue-item') && !el.classList.contains('current') && !el.classList.contains('pending')) take(el);
            }
            return {ids, uris};
        }

        async function sendOrder() {
            try {
                await api('/api/queue/reorder', {method: 'POST', body: JSON.stringify(queueOrder())});
            } catch (e) {
                toast(e.message, true);
            }
            document.getElementById('queue').dataset.key = '';
            refreshStatus();
        }

        function queueItemEl(item, isCurrent, container, inBlock = false) {
            {
                const div = document.createElement('div');
                div.className = 'queue-item' + (isCurrent ? ' current' : '');
                div.dataset.id = item.id;
                div.dataset.uri = item.uri;
                const handle = document.createElement('span');
                handle.className = inBlock ? 'handle in-handle' : 'handle';
                handle.textContent = isCurrent ? '▶' : '⠿';
                const text = document.createElement('div');
                text.className = 'text';
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = (item.title || item.name) + (item.episode ? ` · ${item.episode}` : '') + (item.duration > 0 ? ` · ${fmtTime(item.duration)}` : '');
                const file = document.createElement('div');
                file.className = 'file';
                file.textContent = [item.title ? item.name : '', item.queued_by ? `queued by ${item.queued_by}` : ''].filter(Boolean).join(' · ');
                text.append(title, file);
                const btn = document.createElement('button');
                btn.className = 'danger';
                btn.textContent = '✕';
                btn.title = 'Remove from queue';
                btn.onclick = async () => {
                    try { await api('/api/queue/' + item.id, {method: 'DELETE'}); container.dataset.key = ''; refreshStatus(); }
                    catch (e) { toast(e.message, true); }
                };
                div.append(handle, posterEl(item.poster, '', 'thumb'), text, btn);
                return div;
            }
        }

        Sortable.create(document.getElementById('queue'), {
            draggable: '.queue-item, .queue-group',
            handle: '.handle:not(.in-handle)',   // a block's own handle, or a loose item's; items inside blocks have their own list
            filter: '.current, .pending',   // the playing item stays put; downloads aren't in VLC yet
            preventOnFilter: false,
            animation: 150,
            delay: 150, delayOnTouchOnly: true,   // let phones scroll without grabbing items
            // The queue panel scrolls internally. Native HTML5 drag won't auto-scroll a nested panel,
            // so use Sortable's fallback drag with its own auto-scroll when near the top/bottom edge.
            forceFallback: true,
            fallbackTolerance: 3,
            forceAutoScrollFallback: true,
            scroll: true, scrollSensitivity: 80, scrollSpeed: 12, bubbleScroll: true,
            // Nothing goes above the playing item: a drop on it lands right under it instead of bouncing back.
            onMove: evt => evt.related.classList.contains('current') ? 1 : true,
            onStart: () => { dragging = true; document.body.classList.add('sortable-dragging'); },
            onEnd: () => {
                dragging = false;
                document.body.classList.remove('sortable-dragging');
                sendOrder();
            },
        });


        // --- Images: drop anywhere on the page, or pick a file (phones) ---
        const dropzone = document.getElementById('dropzone');
        const imageInput = document.getElementById('image-file');
        document.getElementById('image-pick').onclick = () => imageInput.click();
        imageInput.addEventListener('change', () => { if (imageInput.files[0]) uploadImage(imageInput.files[0]); imageInput.value = ''; });
        let dragDepth = 0;
        window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; dropzone.classList.add('over'); } });
        window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; dropzone.classList.remove('over'); } });
        window.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
        window.addEventListener('drop', (e) => {
            if (!e.dataTransfer || !e.dataTransfer.files.length) return;
            e.preventDefault();
            dragDepth = 0; dropzone.classList.remove('over');
            uploadImage(e.dataTransfer.files[0]);
        });

        async function uploadImage(file) {
            if (!file.type.startsWith('image/')) { toast('That is not an image file.', true); return; }
            const form = new FormData();
            form.append('file', file);
            form.append('user', nameBox.value.trim());
            form.append('duration', document.getElementById('image-duration').value);
            dropzone.classList.add('busy');
            toast(`Uploading ${file.name}...`);
            try {
                const data = await api('/api/queue/image', {method: 'POST', body: form});
                toast(data.message);
                refreshStatus();
            } catch (e) {
                toast(e.message, true);
            } finally {
                dropzone.classList.remove('busy');
            }
        }

        document.querySelectorAll('.controls button').forEach(btn => {
            btn.onclick = async () => {
                try {
                    await api('/api/control', {method: 'POST', body: JSON.stringify({action: btn.dataset.action})});
                    setTimeout(refreshStatus, 300);
                } catch (e) { toast(e.message, true); }
            };
        });

        const YT_LINK_RE = /^(https?:\/\/)?(www\.|m\.|music\.)?(youtube\.com\/|youtu\.be\/)/i;
        document.getElementById('search').addEventListener('input', (e) => {
            // A pasted YouTube link works from any library: jump to YouTube and look it up.
            if (activeLibrary !== YT && ytEnabled && YT_LINK_RE.test(e.target.value.trim())) {
                const chip = [...document.querySelectorAll('#chips .chip')].find(c => c.classList.contains('yt'));
                if (chip) { chip.click(); return; }  // the chip's handler runs the search
            }
            if (activeLibrary !== YT) { renderGrid(); return; }
            clearTimeout(ytTimer);
            ytTimer = setTimeout(searchYouTube, YT_LINK_RE.test(e.target.value.trim()) ? 0 : 700);  // links go straight away, typing is debounced
        });
        document.getElementById('search').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && activeLibrary === YT) { clearTimeout(ytTimer); searchYouTube(); }
        });

        fetchMedia();
        refreshStatus();
        setInterval(refreshStatus, 3000);
    </script>
</body>
</html>
